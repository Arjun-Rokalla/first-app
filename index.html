<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Web App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="card">
      <h1>Welcome to My First Web App</h1>
      <p>Enter your name and click the button to create a friendly greeting.</p>

      <div class="controls">
        <input id="nameInput" type="text" placeholder="Enter your name" />
        <button id="greetBtn">Say Hello</button>
      </div>

      <p id="message" class="message">Your greeting will appear here.</p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
